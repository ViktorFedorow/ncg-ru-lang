# - Global group

MainSectionTitle: "ОСНОВНЫЕ НАСТРОЙКИ"

skillPointsRequiredToLevelUp_name: "Очки, необходимые для повышения уровня"
skillPointsRequiredToLevelUp_desc: "|-
  Количество очков навыков, необходимых для повышения уровня.
  Очки навыков определяются в следующих настройках.

  Значение «Максимальный уровень» — это уровень игрока, которого вы можете достичь, если естественным образом повысите все влияющие навыки до 100.
  Уровень может быть выше с помощью модов, которые снимают ограничения на уровни навыков."
skillPointsRequiredToLevelUpMaxLevel: "Максимальный уровень: {level}"

skillPointsPerMajorSkillUp_name: "Основной вклад повышения навыков в прогресс повышения уровня"
skillPointsPerMajorSkillUp_desc: "|-
  Количество очков, добавляемых к прогрессу повышения уровня игрока при естественном повышении основного навыка.
  Ваниль равен 1. Допускаются десятичные дроби."

skillPointsPerMinorSkillUp_name: "Незначительный вклад в повышение навыков в прогресс повышения уровня"
skillPointsPerMinorSkillUp_desc: "|-
  Количество очков, добавляемых к прогрессу повышения уровня игрока при естественном повышении второстепенного навыка.
  Ваниль равен 1. Допускаются десятичные дроби."
  
skillPointsPerMiscSkillUp_name: "Разный вклад повышения навыков в повышение уровня"
skillPointsPerMiscSkillUp_desc: |-
  Количество очков, добавляемых к прогрессу повышения уровня игрока при естественном повышении разного навыка.
  Ваниль — 0. Допускаются десятичные дроби.

messagesLogKey_name: "Ключ окна журнала сообщений"
messagesLogKey_desc: |-
  Выберите клавишу, чтобы отобразить окно журнала сообщений.
  Ключ игнорируется в меню, где есть текстовое поле, например меню инвентаря, бартера или алхимии, но не в консоли.

debugMode_name: "Распечатать отладочные сообщения на консоль"

# - Growth screen group

GrowthScreenSectionTitle: "НАСТРОЙКИ ЭКРАНА РОСТА"
GrowthScreenSectionDesc: "Настройте экран, отображаемый после отдыха, и ждет ли его рост, как в Ваниле."

growthScreen_name: "Экран роста"
growthScreen_desc: |-
  Показывает ваши атрибуты и прирост здоровья на экране, когда вы отдыхаете (кнопка «Отдых» в меню отдыха, а не «Подождать»), как это делает Ваниль, когда вы повышаете уровень. Путешествие, тюремное заключение и отдых, прерванный существом, не учитываются.
  «После отдыха»: после каждого отдыха, следующего за повышением атрибута или повышением уровня, с учетом прироста, полученного с момента последнего отображения экрана.
  «После отдыха при повышении уровня»: после первого отдыха после повышения уровня.
  После повышения уровня на экране появляется изображение и текст повышения уровня Vanilla.
growthScreenNever: "Никогда"
growthScreenRest: «После отдыха»
growthScreenLevelUp: "После отдыха при повышении уровня»
requiresUiToolkit: "Требуется мод OpenMW UI Toolkit».

delayGrowth_name: "Задержка роста на экране»
delayGrowth_desc: |-
  Ваши атрибуты, включая удачу, и ваш уровень растут только тогда, когда отображается «Экран роста», как в Vanilla, и ваше здоровье следует за ними. Потери по-прежнему применяются сразу.
  В выключенном состоянии они растут вместе с вашими навыками, и на экране подводятся итоги.
  Ожидаемые уровни появляются по одному на каждый отдых, а всплывающие подсказки в окне статистики показывают, что даст следующий отдых.
  Если его отключить или установить для параметра «Экран роста» значение «Никогда» (что также отключает его), ожидаемая прибыль будет применена сразу. Изменение настроек роста (атрибуты, удача, ограничения, уровень) сразу же применяет ожидающие улучшения атрибутов, в то время как уже заработанные уровни продолжают ждать отдыха.

# - Attributes group

AttributesSectionTitle: "АТРИБУТЫ: НАСТРОЙКИ РОСТА"
AttributesSectionDesc: "Настройте рост атрибутов."

startAttrRatio_name: "Соотношение начальных значений"
startAttrRatio_desc: |-
  Решите, должны ли стартовые атрибуты в большей степени определяться расой, предпочтительными атрибутами и изменениями платных модификаций или навыками и их атрибутами, на которые они влияют.
  Чем ниже коэффициент, тем выше влияние навыков на начальные значения атрибутов.

  При 100% вы начнете прохождение со своими первоначальными атрибутами.
  При 50% атрибуты уменьшаются вдвое, а другая половина увеличивается на половину ваших начальных навыков.
  При значении 0% значения атрибутов полностью увеличиваются на полные значения навыков.

  Чтобы сохранить баланс, NCG добавляет константу нормализации к результирующим атрибутам, чтобы обеспечить одинаковое среднее их начального значения независимо от настройки.
  Эта настройка не влияет на удачу.
startAttrRatioNone: "0%"
startAttrRatioQuarter: "25%"
startAttrRatioHalf: "50%"
startAttrRatioThreeQuarters: "75%"
startAttrRatioFull: "100%"

attrGrowthRate_name: "Темпы роста"
attrGrowthRate_desc: |-
  Управляет скоростью роста атрибутов в зависимости от их влияющих навыков.
  На рост также влияют настройки «Фактор роста от основных/второстепенных/разных/пользовательских навыков».
  На 30-м уровне игрока атрибуты получают в среднем около +24 со скоростью «Медленно» и +60 со скоростью «Быстрее», что близко к темпу Ваниллы.
  У удачи есть своя настройка «Скорость роста удачи».
attrGrowthRateSlower: "Помедленнее"
attrGrowthRateSlow: "Медленный"
attrGrowthRateStandard: "Стандартный"
attrGrowthRateFast: "Быстрый"
attrGrowthRateFaster: "Быстрее"

growthFactorFromMajorSkills_name: "Фактор роста от основных навыков"
growthFactorFromMajorSkills_desc: "Процентный коэффициент, применяемый к росту атрибутов, когда он происходит в результате значительного увеличения навыков».
growthFactorFromMinorSkills_name: "Фактор роста от второстепенных навыков»
growthFactorFromMinorSkills_desc: "Процентный коэффициент, применяемый к росту атрибута, когда он происходит из-за незначительного увеличения навыка.."
growthFactorFromMiscSkills_name: "Фактор роста от разных навыков"
growthFactorFromMiscSkills_desc: "Процентный коэффициент, применяемый к росту атрибутов, когда он происходит в результате увеличения различных навыков.."
growthFactorFromCustomSkills_name: "Фактор роста от пользовательских навыков"
growthFactorFromCustomSkills_desc: "Процентный коэффициент, применяемый к росту атрибутов, когда он происходит в результате увеличения пользовательского навыка «Разное» (добавленного через мод Skill Framework).."

attributeUncapper_name: "Максимальное значение Uncapper атрибута"
attributeUncapper_desc: |-
  Ограничьте рост атрибута максимальным значением (для стандартного поведения установите значение 100).
  Установите значение 0, чтобы отключить ограничение (неограниченное значение).

perAttributeUncapper_name: "Переопределения функции Uncapper для каждого атрибута"
perAttributeUncapper_desc: |-
  Добавьте максимальные значения для каждого атрибута, которые переопределяют глобальное значение uncapper.

showAttributeChangeNotifications_name: "Показать уведомления об изменении атрибутов"
showAttributeChangeNotifications_desc: |-
  Отображение уведомлений при увеличении или уменьшении атрибутов.
  При использовании «Задержки роста на экране» каждое увеличение будет уведомляться, как только вы его заработаете, а остальные будут его применять; когда остальные его применяют, это показывает «Экран роста», и он попадает только в журнал сообщений.

showAttributeValueDetails_name: "Отображение сведений о базовом значении атрибута во всплывающих подсказках"
showAttributeValueDetails_desc: "Предоставляет подробные сведения о расчете базовых значений атрибутов во всплывающих подсказках атрибутов окна статистики персонажа."


# - Luck group

LuckSectionTitle: "АТРИБУТЫ: НАСТРОЙКИ УДАЧИ"
LuckSectionDesc: "Настройте рост удачи».

luckGrowthMode_name: "Режим роста удачи»
luckGrowthMode_desc: |-
  Поскольку ни один навык не управляет Удачей, этот мод предлагает 2 разных способа увеличить ее.

  За уровень: Удача растет с вашим уровнем.

  Принятие риска (по умолчанию): Удача растет, когда вы добиваетесь успеха, несмотря на низкую вероятность успеха: произносите заклинания, наносите удары противникам, взламываете замки, обезвреживаете ловушки, ремонтируете, варите зелья, зачаровываете, перезаряжаете магический предмет, карманные кражи, торгуетесь, убеждаете или используете навык, добавленный модом, который его поддерживает.
  Чем ниже ваш шанс (включая баффы, дебаффы и {усталость}), тем выше прирост Удачи.
  Этот рост Удачи происходит поверх роста, который навык дает его управляющим атрибутам, и происходит, как только вы используете навык. Он сохраняется, даже если впоследствии навык снижается.
  Начните новую игру, чтобы поиграть с ним: большая часть его Удачи приходится на первые уровни, а игра, начатая до версии 2.5, засчитывает только использования, сделанные с тех пор.
  Рискованное использование навыков всегда отслеживается, независимо от режима, поэтому переключение режимов в середине игры соответствующим образом обновит вашу удачу (начиная с версии 2.5).
luckGrowthModeLevel: "За уровень"
luckGrowthModeRisk: "Принятие риска"

luckGrowthRate_name: "Скорость роста удачи"
luckGrowthRate_desc: |-
 Управляет скоростью роста Удачи, независимо от других атрибутов.

  За уровень: постоянный рост за уровень игрока (медленнее 0,2, медленно 0,4, стандартно 0,6, быстро 0,8, быстрее 1, больше всего дает ваниль).
  В отличие от версии Vanilla, где повышение Удачи требует одного из трех повышений уровня, рост Удачи не замедляет другие атрибуты.

  Принятие риска: переменный рост при каждом успешном использовании навыка, основанный на вероятности неудачи и выигрыше.
  При шансе на успех 20% или ниже уровень навыка увеличивает Удачу с этой скоростью примерно в 0,6 раза больше, чем он увеличивает свои управляющие атрибуты с «Скоростью роста», масштабируемой для каждого навыка (от х0,5 до х3,5) и уменьшающейся ниже уровня навыка 15. Торговля засчитывается как одно стандартное использование, независимо от ее предела. Это подробно описано в файле readme, а также применяются настройки «Фактор роста от основных/второстепенных/разных/пользовательских навыков».
  
  Пример на уровне игрока 30 со скоростью замедления: +11,6 Удача за уровень и принятие риска +39,8 /+7,4 /+0,6 /+0,0, если каждое успешное использование имело шанс на успех 30 /50 /70 /90%, или около +11 при обычном прохождении и +17 при риске, где атрибуты, вырастающие из навыков, в среднем получают +24..
luckGrowthRateNone: "Никто"
luckGrowthRateSlower: "Помедленнее"
luckGrowthRateSlow: "Медленный"
luckGrowthRateStandard: "Стандартный"
luckGrowthRateFast: "Быстрый"
luckGrowthRateFaster: "Быстрее"

legacyLuckGrowth_name: "Наследие роста удачи (v2.4)"
legacyLuckGrowth_desc: |-
  Восстанавливает прирост Удачи NCG до версии 2.5 для игр, начатых с ней, которые затем сохраняют свои атрибуты и Удачу.
  Удача растет с вашим уровнем на 0,25 (Низкий), 0,5 (Средний) или 1 (Высокий) за уровень и занимает 6,25%, 12,5% или 25% от роста других атрибутов.
  При включении он заменяет отключенные настройки «Режим роста удачи» и «Скорость роста удачи».
  Чтобы игра запускалась до версии 2.5, как она была, выберите ее скорость: обновление до версии 2.5 превратило низкую в медленную, среднюю в быструю и высокую в быструю..
legacyLuckGrowthDisabled: "Ничего"
legacyLuckGrowthLow: "Низкий"
legacyLuckGrowthMed: "Середина"
legacyLuckGrowthHigh: "Высокий"


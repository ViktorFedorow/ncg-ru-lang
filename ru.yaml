perLevelHpFactor_name: "Коэффициент прироста HP за уровень"
perLevelHpFactor_desc: |-
  Этот параметр позволяет вам решить, сколько HP вы получите за уровень, на основе предыдущей настройки коэффициента HP..

  Например, при коэффициенте HP 50% и низком (2%) приросте HP за уровень вы получите:
  HP за уровень: 2/100 *1/2 *({endurance} *4 + {strength} *2 + {willpower}) /7
perLevelHpFactorHigh: "Высокий (8%)"
perLevelHpFactorMed: "Середина (4%)"
perLevelHpFactorLow: "Низкий (2%)"
perLevelHpFactorNone: "Никто (0%)"

showHealthChangeNotifications_name: "Показывать уведомления об изменениях в состоянии здоровья"
showHealthChangeNotifications_desc: |-
  Отображать уведомления, когда HP увеличивается или уменьшается.
  При использовании «HP на основе состояния» не уведомляются частые изменения, которые приносят усиления и понижения атрибутов, а только изменения базовых значений атрибутов и уровня.
  Благодаря функции «Задержка роста на экране» каждый выигрыш будет уведомлен, как только вы его заработаете, а остальные будут его применять; когда остальные его применяют, "Экран роста" показывает его и он попадает только в журнал сообщений.

showHealthValueDetails_name: "Отображение сведений о ценности здоровья во всплывающих подсказках"
showHealthValueDetails_desc: "Предоставляет подробную информацию о расчете здоровья во всплывающей подсказке о состоянии здоровья в окне статистики персонажа."


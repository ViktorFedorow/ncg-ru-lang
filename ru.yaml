HealthSectionDesc: "Настройка функций работоспособности."

stateBasedHp_name: "Динамическое изменение уровня HP"
stateBasedHp_desc: "Динамически корректирует значения HP в зависимости от состояния ваших атрибутов, а также с учетом укреплений, истощения, повреждений и всех других внешних изменений.."

baseHpFactor_name: "Базовый и поуровневый коэффициент здоровья"
baseHpFactor_desc: |-
  Базовое здоровье игрока и прирост HP за уровень основаны на средневзвешенном значении {выносливости}, {силы} и {силы воли}:
    ({endurance} *4 + {strength} *2 + {willpower}) /7
  Этот параметр позволяет вам уменьшить или увеличить как базовое, так и количество HP за уровень, чтобы изменить сложность игры..
